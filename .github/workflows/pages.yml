name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Pages artifact
        run: |
          if [ ! -d frontend ]; then
            echo "::error::The frontend/ directory is missing from the checked-out repository."
            exit 1
          fi
          if [ ! -f frontend/dashboard.html ]; then
            echo "::error::frontend/dashboard.html is missing from the checked-out repository."
            exit 1
          fi
          mkdir -p _site/frontend
          cp -R frontend/. _site/frontend/
          test -f _site/frontend/dashboard.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
