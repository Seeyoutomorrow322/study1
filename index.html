<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080812">
  <title>工作日志</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #182230;
      background: #f5f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body { min-width: 320px; margin: 0; }

    button, input, textarea { font: inherit; }

    button {
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid #d5dce7;
      border-radius: 9px;
      background: #fff;
      color: #253247;
      cursor: pointer;
    }

    button:hover { border-color: #9aabc2; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid #b8d2ff;
      outline-offset: 2px;
    }

    button:disabled { cursor: wait; opacity: .65; }

    .primary-button {
      border-color: #2563eb;
      background: #2563eb;
      color: #fff;
    }

    .primary-button:hover { border-color: #1d4ed8; background: #1d4ed8; }

    .page { width: min(100% - 32px, 820px); margin: 0 auto; padding: 42px 0 64px; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 26px;
    }

    h1 { margin: 0; font-size: clamp(25px, 5vw, 32px); letter-spacing: -.04em; }
    h2 { margin: 0; font-size: 18px; }
    .subtitle { margin: 7px 0 0; color: #667085; font-size: 14px; }
    .header-actions, .form-actions { display: flex; flex-wrap: wrap; gap: 9px; }

    .card {
      margin-top: 18px;
      padding: 22px;
      border: 1px solid #e1e6ef;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 5px 18px rgb(22 34 51 / 4%);
    }

    .status {
      margin: 0 0 18px;
      padding: 11px 13px;
      border-radius: 9px;
      background: #eef4ff;
      color: #294b82;
      font-size: 14px;
      line-height: 1.5;
    }

    .status[data-kind="error"] { background: #fff0f0; color: #a12b2b; }
    .status[data-kind="success"] { background: #edfaf2; color: #207044; }

    .auth-form, .log-form { display: grid; gap: 14px; }
    .auth-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    label { display: grid; gap: 7px; color: #344054; font-size: 14px; font-weight: 600; }
    input, textarea {
      width: 100%;
      min-height: 43px;
      padding: 10px 12px;
      border: 1px solid #d5dce7;
      border-radius: 8px;
      background: #fff;
      color: #182230;
    }

    textarea { min-height: 150px; resize: vertical; line-height: 1.65; }
    .help-text, .muted { color: #667085; font-size: 13px; }
    .help-text { margin: 0; line-height: 1.6; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .log-list { display: grid; gap: 12px; margin-top: 18px; }

    .log-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 16px;
      border: 1px solid #e7ebf2;
      border-radius: 10px;
    }

    .log-date { margin: 0 0 7px; color: #344054; font-size: 13px; font-weight: 650; }
    .log-preview { margin: 0; color: #667085; font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
    .log-meta { min-width: 0; }
    .empty-state { margin: 18px 0 4px; color: #667085; font-size: 14px; }

    dialog {
      width: min(560px, calc(100% - 32px));
      max-height: min(80vh, 700px);
      padding: 0;
      border: 0;
      border-radius: 14px;
      box-shadow: 0 20px 70px rgb(15 23 42 / 25%);
    }

    dialog::backdrop { background: rgb(15 23 42 / 45%); }
    .dialog-content { padding: 23px; }
    .dialog-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .dialog-content pre { margin: 20px 0; color: #344054; font: inherit; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
    [hidden] { display: none !important; }

    body:has(#auth-card:not([hidden])) {
      min-height: 100vh;
      color: #edf0ff;
      background:
        radial-gradient(ellipse at 15% 15%, rgb(64 37 150 / 34%), transparent 38%),
        radial-gradient(ellipse at 85% 82%, rgb(20 92 190 / 22%), transparent 40%),
        radial-gradient(ellipse at 50% 50%, #14132b 0%, #090912 58%, #050509 100%);
    }

    body:has(#auth-card:not([hidden])) .page {
      position: relative;
      z-index: 1;
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      justify-content: center;
      width: min(100% - 32px, 440px);
      padding: 36px 0;
    }

    body:has(#auth-card:not([hidden])) header { display: none; }

    body:has(#auth-card:not([hidden])) #status {
      margin: 0 0 14px;
      border: 1px solid rgb(91 119 255 / 35%);
      background: rgb(26 34 76 / 72%);
      color: #d8e1ff;
      box-shadow: 0 0 22px rgb(67 86 255 / 12%);
    }

    body:has(#auth-card:not([hidden])) #status[data-kind="error"] {
      border-color: rgb(255 93 145 / 48%);
      background: rgb(75 23 48 / 76%);
      color: #ffc4d7;
    }

    body:has(#auth-card:not([hidden])) #status[data-kind="success"] {
      border-color: rgb(64 230 194 / 42%);
      background: rgb(15 62 65 / 76%);
      color: #b8fff0;
    }

    body:has(#auth-card:not([hidden])) #auth-card {
      position: relative;
      isolation: isolate;
      margin: 0;
      padding: clamp(26px, 7vw, 42px);
      overflow: hidden;
      border: 1px solid rgb(143 126 255 / 55%);
      border-radius: 20px;
      background: linear-gradient(145deg, rgb(24 24 50 / 88%), rgb(11 14 31 / 82%));
      box-shadow:
        0 0 0 1px rgb(46 192 255 / 12%) inset,
        0 0 36px rgb(102 72 255 / 22%),
        0 24px 80px rgb(0 0 0 / 52%);
      backdrop-filter: blur(18px);
    }

    #particle-canvas {
      position: fixed;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .82;
      pointer-events: none;
    }

    body:not(:has(#auth-card:not([hidden]))) #particle-canvas { display: none; }

    #circuit-snake-background {
      position: fixed;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .13;
      filter: drop-shadow(0 0 5px rgb(74 225 255 / 24%)) drop-shadow(0 0 13px rgb(139 89 255 / 14%));
      pointer-events: none;
    }

    body:not(:has(#auth-card:not([hidden]))) #circuit-snake-background { display: none; }

    .pixel-snake-icon {
      display: block;
      width: 38px;
      height: 38px;
      margin: 0 auto 12px;
      filter: drop-shadow(0 0 7px rgb(75 239 255 / 46%));
    }

    .pixel-snake-icon rect { fill: #6beeff; }
    .pixel-snake-icon .snake-eye-pixel { fill: #17152d; }

    .auth-brand-row {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      margin-bottom: 25px;
    }

    .snake-logo {
      margin: 0;
      color: #aefaff;
      font-size: clamp(48px, 12vw, 64px);
      font-weight: 750;
      letter-spacing: .01em;
      line-height: 1.12;
      text-align: center;
      text-shadow:
        0 0 5px #fff,
        0 0 12px #48f4ff,
        0 0 25px #2e9dff,
        0 0 48px #8d54ff;
    }

    .language-select {
      align-self: flex-end;
      min-height: 36px;
      padding: 0 30px 0 11px;
      border: 1px solid rgb(135 137 255 / 52%);
      border-radius: 9px;
      appearance: none;
      background:
        linear-gradient(45deg, transparent 50%, #aeb3ff 50%) calc(100% - 14px) 15px / 5px 5px no-repeat,
        linear-gradient(135deg, #aeb3ff 50%, transparent 50%) calc(100% - 10px) 15px / 5px 5px no-repeat,
        rgb(12 16 37 / 78%);
      color: #d8dcff;
      font: inherit;
      font-size: 12px;
      text-shadow: 0 0 10px rgb(119 120 255 / 60%);
      box-shadow: 0 0 14px rgb(102 90 255 / 14%), inset 0 0 12px rgb(63 104 255 / 7%);
      cursor: pointer;
    }

    .language-select:focus {
      border-color: #9b91ff;
      outline: none;
      box-shadow: 0 0 0 3px rgb(112 95 255 / 16%), 0 0 20px rgb(96 106 255 / 34%);
    }

    .language-select option { background: #111329; color: #e7e9ff; }

    .settings-trigger {
      position: fixed;
      z-index: 5;
      bottom: max(22px, env(safe-area-inset-bottom));
      left: max(22px, env(safe-area-inset-left));
      display: grid;
      width: 50px;
      min-height: 50px;
      padding: 0;
      place-items: center;
      border: 1px solid rgb(119 143 255 / 58%);
      border-radius: 16px;
      background: rgb(16 19 43 / 82%);
      color: #bcefff;
      box-shadow: 0 0 18px rgb(91 117 255 / 27%), inset 0 0 14px rgb(76 127 255 / 10%);
      backdrop-filter: blur(12px);
      transition: border-color .2s ease, background .2s ease, box-shadow .2s ease, transform .2s ease;
    }

    .settings-trigger:hover {
      transform: rotate(18deg);
      border-color: #72eaff;
      background: rgb(33 40 82 / 94%);
      box-shadow: 0 0 24px rgb(77 201 255 / 42%), 0 0 34px rgb(119 89 255 / 25%);
    }

    .settings-trigger:focus-visible { outline-color: #72eaff; }
    .settings-trigger svg { width: 23px; height: 23px; filter: drop-shadow(0 0 5px rgb(92 211 255 / 85%)); }

    .settings-dialog {
      width: min(390px, calc(100% - 32px));
      max-height: min(80vh, 600px);
      overflow: visible;
      border: 1px solid rgb(143 126 255 / 58%);
      border-radius: 18px;
      background: linear-gradient(145deg, rgb(24 24 50 / 97%), rgb(11 14 31 / 97%));
      color: #edf0ff;
      box-shadow: 0 0 34px rgb(102 72 255 / 25%), 0 24px 80px rgb(0 0 0 / 58%);
      backdrop-filter: blur(18px);
    }

    .settings-dialog::backdrop { background: rgb(3 4 14 / 72%); backdrop-filter: blur(5px); }
    .settings-content { padding: 23px; }
    .settings-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
    .settings-heading h2 { color: #fff; text-shadow: 0 0 14px rgb(121 113 255 / 42%); }
    .settings-close {
      display: grid;
      width: 38px;
      min-height: 38px;
      padding: 0;
      place-items: center;
      border-color: rgb(132 130 255 / 42%);
      background: rgb(26 28 57 / 82%);
      color: #e4e5ff;
      font-size: 21px;
    }

    .settings-close:hover { border-color: #66d9ff; box-shadow: 0 0 16px rgb(79 184 255 / 25%); }
    .settings-options { display: grid; gap: 18px; }
    .settings-option { display: grid; gap: 9px; color: #c8ccef; font-size: 13px; font-weight: 600; }
    .settings-option .language-select { align-self: stretch; width: 100%; min-height: 44px; }
    .settings-toggle { display: flex; align-items: center; gap: 11px; cursor: pointer; }
    .settings-toggle input { width: 18px; min-height: 18px; accent-color: #7567ff; }

    @media (prefers-reduced-motion: reduce) {
      #particle-canvas { opacity: .55; }
      #circuit-snake-background { opacity: .1; }
      .settings-trigger, .settings-trigger:hover { transform: none; transition: none; }
    }

    body:has(#auth-card:not([hidden])) #auth-card::before {
      position: absolute;
      z-index: -1;
      top: -120px;
      right: -90px;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: rgb(80 95 255 / 18%);
      content: "";
      filter: blur(38px);
      pointer-events: none;
    }

    body:has(#auth-card:not([hidden])) #auth-title {
      margin-bottom: 27px;
      color: #fff;
      font-size: 25px;
      letter-spacing: .02em;
      text-align: center;
      text-shadow: 0 0 22px rgb(121 113 255 / 42%);
    }

    body:has(#auth-card:not([hidden])) .auth-form { gap: 20px; }
    body:has(#auth-card:not([hidden])) .auth-fields { grid-template-columns: 1fr; gap: 17px; }

    body:has(#auth-card:not([hidden])) #auth-form label {
      gap: 9px;
      color: #c8ccef;
      font-size: 13px;
      letter-spacing: .04em;
    }

    body:has(#auth-card:not([hidden])) #auth-form input {
      min-height: 49px;
      padding: 11px 14px;
      border: 1px solid rgb(129 145 206 / 36%);
      border-radius: 10px;
      background: rgb(5 8 22 / 72%);
      color: #f2f4ff;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    body:has(#auth-card:not([hidden])) #auth-form input::placeholder { color: #7d85a9; }

    body:has(#auth-card:not([hidden])) #auth-form input:focus {
      border-color: #8e82ff;
      outline: none;
      background: rgb(9 12 31 / 92%);
      box-shadow: 0 0 0 3px rgb(112 95 255 / 16%), 0 0 22px rgb(96 106 255 / 34%);
    }

    body:has(#auth-card:not([hidden])) #auth-form .form-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    body:has(#auth-card:not([hidden])) #auth-form button {
      width: 100%;
      min-height: 49px;
      border: 1px solid rgb(132 130 255 / 58%);
      border-radius: 10px;
      background: rgb(26 28 57 / 82%);
      color: #e4e5ff;
      font-weight: 650;
      letter-spacing: .04em;
      transition: border-color .2s ease, background .2s ease, box-shadow .2s ease, transform .2s ease;
    }

    body:has(#auth-card:not([hidden])) #auth-form button:hover {
      transform: translateY(-1px);
      border-color: #66d9ff;
      background: rgb(42 45 91 / 94%);
      box-shadow: 0 0 19px rgb(79 184 255 / 28%), 0 0 30px rgb(119 89 255 / 20%);
    }

    body:has(#auth-card:not([hidden])) #auth-form .primary-button {
      border-color: #6a7dff;
      background: linear-gradient(100deg, #6558e9, #3979e8);
      color: #fff;
      box-shadow: 0 0 22px rgb(91 101 255 / 28%);
    }

    body:has(#auth-card:not([hidden])) #auth-form .primary-button:hover {
      border-color: #89e8ff;
      background: linear-gradient(100deg, #796bff, #3999f6);
      box-shadow: 0 0 24px rgb(74 184 255 / 48%), 0 0 38px rgb(117 91 255 / 35%);
    }

    @media (max-width: 560px) {
      .page { padding-top: 28px; }
      .card { padding: 17px; }
      .auth-fields { grid-template-columns: 1fr; }
      body:has(#auth-card:not([hidden])) #auth-card { padding: 20px; }
      .log-item { align-items: stretch; flex-direction: column; gap: 12px; }
      .log-item button { align-self: flex-start; }
      body:has(#auth-card:not([hidden])) .page { padding: 24px 0; }
    }

    @media print {
      :root { background: #fff; }
      body { background: #fff; }
      .page { width: 100%; padding: 0; }
      header, #auth-card, #entry-card, #status, #settings-trigger, #new-log-button, .log-item button, #empty-state, dialog { display: none !important; }
      #logs-card { margin: 0; padding: 0; border: 0; box-shadow: none; }
      .section-heading { margin-bottom: 14px; }
      .log-item { break-inside: avoid; border-color: #ddd; }
      .log-preview { color: #333; }
    }
  </style>
</head>
<body>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>
  <svg id="circuit-snake-background" aria-hidden="true" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="circuit-trace" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#47eaff"/>
        <stop offset=".5" stop-color="#668dff"/>
        <stop offset="1" stop-color="#a365ff"/>
      </linearGradient>
      <pattern id="circuit-snake-pattern" width="420" height="300" patternUnits="userSpaceOnUse">
        <g fill="none" stroke="url(#circuit-trace)" stroke-linecap="square" stroke-linejoin="bevel">
          <path d="M18 286 V244 H70 V210 H112 V168 H158 V128 H202 V86 H245 V42 H286 V15" stroke-width="3"/>
          <path d="M112 168 H80 V145 H52 M158 128 H190 V148 H222 M202 86 H174 V62 H146 M245 42 H278 V62 H307" stroke-width="1.7"/>
          <path d="M286 15 H322 L338 31 V52 L322 68 H288 L272 52 V31 Z" stroke-width="2.5"/>
          <path d="M293 41 H318" stroke-width="4"/>
          <path d="M70 244 H48 V267 M158 168 V190 H183 M245 86 H270 V105" stroke-width="1.4"/>
        </g>
        <g fill="#071523" stroke="#66eaff" stroke-width="2">
          <circle cx="70" cy="244" r="5"/><circle cx="112" cy="210" r="5"/>
          <circle cx="158" cy="168" r="5"/><circle cx="202" cy="128" r="5"/>
          <circle cx="245" cy="86" r="5"/><circle cx="286" cy="42" r="5"/>
          <circle cx="80" cy="145" r="3.5"/><circle cx="190" cy="148" r="3.5"/>
          <circle cx="174" cy="62" r="3.5"/><circle cx="278" cy="62" r="3.5"/>
        </g>
        <g fill="#b6faff">
          <circle cx="70" cy="244" r="1.5"/><circle cx="112" cy="210" r="1.5"/>
          <circle cx="158" cy="168" r="1.5"/><circle cx="202" cy="128" r="1.5"/>
          <circle cx="245" cy="86" r="1.5"/><circle cx="286" cy="42" r="1.5"/>
        </g>
        <path d="M293 41 H318" fill="none" stroke="#d5ffff" stroke-width="1.4"/>
      </pattern>
    </defs>
    <rect width="1200" height="800" fill="url(#circuit-snake-pattern)"/>
  </svg>
  <button id="settings-trigger" class="settings-trigger" type="button" aria-label="设置" aria-haspopup="dialog" aria-controls="settings-dialog">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 8.25a3.75 3.75 0 1 0 0 7.5 3.75 3.75 0 0 0 0-7.5Z" stroke="currentColor" stroke-width="1.7"/>
      <path d="m19.4 13.5 1.2.93-1.2 2.08-1.47-.5a7.8 7.8 0 0 1-1.48.86l-.27 1.53h-2.4l-.27-1.53a7.8 7.8 0 0 1-1.48-.86l-1.47.5-1.2-2.08 1.2-.93a7.5 7.5 0 0 1 0-1.72l-1.2-.93 1.2-2.08 1.47.5a7.8 7.8 0 0 1 1.48-.86l.27-1.53h2.4l.27 1.53a7.8 7.8 0 0 1 1.48.86l1.47-.5 1.2 2.08-1.2.93a7.5 7.5 0 0 1 0 1.72Z" transform="translate(-1.4 -1)" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/>
    </svg>
  </button>
  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
    <div class="settings-content">
      <div class="settings-heading">
        <h2 id="settings-title" data-i18n="settingsTitle">设置</h2>
        <button id="settings-close" class="settings-close" type="button" aria-label="关闭设置">×</button>
      </div>
      <div class="settings-options">
        <label class="settings-option">
          <span data-i18n="languageLabel">语言</span>
          <select id="language-select" class="language-select" aria-label="语言">
            <option value="zh-CN">中文</option>
            <option value="en-US">English</option>
            <option value="ko-KR">한국어</option>
            <option value="ja-JP">日本語</option>
          </select>
        </label>
        <label class="settings-toggle">
          <input id="particles-toggle" type="checkbox" checked>
          <span data-i18n="particlesSetting">动态粒子背景</span>
        </label>
      </div>
    </div>
  </dialog>
  <main class="page">
    <header>
      <div>
        <h1 data-i18n="appTitle">工作日志</h1>
        <p class="subtitle" data-i18n="appSubtitle">记录每天的工作进展</p>
      </div>
      <div class="header-actions">
        <button id="export-button" type="button" data-i18n="export" hidden>导出 PDF</button>
        <button id="logout-button" type="button" data-i18n="logout" hidden>退出登录</button>
      </div>
    </header>

    <p id="status" class="status" role="status" aria-live="polite" hidden></p>

    <section id="auth-card" class="card auth-card" aria-labelledby="auth-title">
      <div class="auth-brand-row">
        <h1 class="snake-logo" data-i18n="logo">贪吃蛇</h1>
      </div>
      <svg class="pixel-snake-icon" viewBox="0 0 40 40" role="img" aria-label="贪吃蛇像素图标">
        <rect x="4" y="20" width="8" height="8" rx="1"/>
        <rect x="12" y="20" width="8" height="8" rx="1"/>
        <rect x="20" y="20" width="8" height="8" rx="1"/>
        <rect x="20" y="12" width="8" height="8" rx="1"/>
        <rect x="28" y="12" width="8" height="8" rx="1"/>
        <rect class="snake-eye-pixel" x="30" y="14" width="2" height="2"/>
      </svg>
      <h2 id="auth-title" data-i18n="loginTitle">登录你的账号</h2>
      <form id="auth-form" class="auth-form">
        <div class="auth-fields">
          <label>
            <span data-i18n="email">邮箱</span>
            <input id="email" type="email" autocomplete="email" data-i18n-placeholder="emailPlaceholder" required>
          </label>
          <label>
            <span data-i18n="password">密码</span>
            <input id="password" type="password" autocomplete="current-password" data-i18n-placeholder="passwordPlaceholder" minlength="6" required>
          </label>
        </div>
        <div class="form-actions">
          <button class="primary-button" type="submit" data-i18n="login">登录</button>
          <button id="signup-button" type="button" data-i18n="signup">注册账号</button>
        </div>
      </form>
    </section>

    <section id="entry-card" class="card" aria-labelledby="entry-title" hidden>
      <div class="section-heading">
        <h2 id="entry-title" data-i18n="writeTitle">写一篇日志</h2>
        <button id="cancel-entry-button" type="button" data-i18n="backToList">返回列表</button>
      </div>
      <form id="log-form" class="log-form">
        <label>
          <span data-i18n="date">日期</span>
          <input id="log-date" type="date" required>
        </label>
        <label>

        save: "저장", logsTitle: "내 업무 일지", newLog: "+ 새 일지 작성",

        savingLog: "일지를 저장하는 중…", saveError: "저장 실패: ", logSaved: "일지가 저장되었습니다.",

      "ja-JP": {

        content: "業務内容", contentPlaceholder: "今日の仕事、課題、次の予定を記録しましょう…",
        save: "保存", logsTitle: "自分の日誌", newLog: "+ 新しい日誌を書く",
        emptyLogs: "日誌はまだありません。最初の日誌を書いてみましょう。", detailTitle: "日誌の詳細",
        close: "閉じる", detailAction: "詳細を見る", logCount: "{count} 件",
        languageLabel: "言語",
        supabaseUnavailable: "Supabase クライアントを読み込めませんでした。接続を確認して再試行してください。",
        loadingLogs: "日誌を読み込み中…", loadLogsError: "日誌の読み込みに失敗しました：",
        loggingIn: "ログイン中…", loginError: "ログインに失敗しました：", loginSuccess: "ログインしました。",
        signingUp: "アカウントを作成中…", signupError: "登録に失敗しました：",
        signupSuccess: "アカウントを作成し、ログインしました。", verifyEmail: "アカウントを作成しました。メールを確認して認証後、ログインしてください。",
        logoutError: "ログアウトに失敗しました：", loggedOut: "ログアウトしました。",
        pleaseLogin: "日誌を保存するにはログインしてください。", emptyContentError: "保存する前に業務内容を入力してください。",
        savingLog: "日誌を保存中…", saveError: "保存に失敗しました：", logSaved: "日誌を保存しました。",
        sessionError: "ログイン状態の取得に失敗しました："
      }
    };

    const languageLocales = {
      "zh-CN": "zh-CN",
      "en-US": "en-US",
      "ko-KR": "ko-KR",
      "ja-JP": "ja-JP"
    };
    let currentLanguage = "zh-CN";

    function translate(key) {
      return translations[currentLanguage][key] || translations["zh-CN"][key] || key;
    }

    function applyLanguage(language) {
      currentLanguage = Object.prototype.hasOwnProperty.call(translations, language) ? language : "zh-CN";
      document.documentElement.lang = currentLanguage;
      document.title = translate("appTitle");

      document.querySelectorAll("[data-i18n]").forEach((element) => {
        element.textContent = translate(element.dataset.i18n);
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((element) => {
        element.placeholder = translate(element.dataset.i18nPlaceholder);
      });

      const languageSelect = document.querySelector("#language-select");
      languageSelect.setAttribute("aria-label", translate("languageLabel"));
      document.querySelector("#close-dialog").setAttribute("aria-label", translate("close"));
      document.querySelector("#settings-trigger").setAttribute("aria-label", translate("settingsTitle"));
      document.querySelector("#settings-close").setAttribute("aria-label", translate("close"));
      renderLogs();
      if (statusKey) {
        elements.status.textContent = `${translate(statusKey)}${statusDetail}`;
      }
    }

    const particleCanvas = document.querySelector("#particle-canvas");
    const particleContext = particleCanvas.getContext("2d");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    let particles = [];
    let particleFrame = 0;
    let particlesEnabled = false;
    let particlesPreference = true;
    let particleWidth = 0;
    let particleHeight = 0;
    let statusKey = "";
    let statusDetail = "";

    function resizeParticleCanvas() {
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      particleWidth = window.innerWidth;
      particleHeight = window.innerHeight;
      particleCanvas.width = Math.round(particleWidth * pixelRatio);
      particleCanvas.height = Math.round(particleHeight * pixelRatio);
      particleCanvas.style.width = `${particleWidth}px`;
      particleCanvas.style.height = `${particleHeight}px`;
      particleContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

      const particleCount = Math.min(120, Math.max(42, Math.round((particleWidth * particleHeight) / 12000)));
      particles = Array.from({ length: particleCount }, () => ({
        x: Math.random() * particleWidth,
        y: Math.random() * particleHeight,
        radius: .5 + Math.random() * 1.5,
        driftX: (Math.random() - .5) * .18,
        driftY: -.08 - Math.random() * .16,
        phase: Math.random() * Math.PI * 2,
        phaseSpeed: .008 + Math.random() * .018
      }));

      if (reducedMotion.matches) drawParticles(0, false);
    }

    function drawParticles(time, animate = true) {
      if (!particleContext) return;
      particleContext.clearRect(0, 0, particleWidth, particleHeight);
      const elapsed = time || 0;

      for (let index = 0; index < particles.length; index += 1) {
        const particle = particles[index];
        if (animate) {
          particle.x += particle.driftX;
          particle.y += particle.driftY;
          particle.phase += particle.phaseSpeed;
          if (particle.y < -4) particle.y = particleHeight + 4;
          if (particle.x < -4) particle.x = particleWidth + 4;
          if (particle.x > particleWidth + 4) particle.x = -4;
        }

        const pulse = .35 + (Math.sin(particle.phase + elapsed * .0004) + 1) * .3;
        const hue = 210 + (index % 5) * 23;
        particleContext.beginPath();
        particleContext.fillStyle = `hsla(${hue}, 100%, 78%, ${pulse})`;
        particleContext.shadowBlur = 9;
        particleContext.shadowColor = `hsla(${hue}, 100%, 66%, ${pulse})`;
        particleContext.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
        particleContext.fill();
      }

      particleContext.shadowBlur = 0;
      if (animate && particlesEnabled && !document.hidden && !reducedMotion.matches) {
        particleFrame = window.requestAnimationFrame(drawParticles);
      } else {
        particleFrame = 0;
      }
    }

    function setParticleAnimation(enabled) {
      particlesEnabled = enabled && particlesPreference;
      particleCanvas.hidden = !particlesEnabled;
      if (particleFrame) {
        window.cancelAnimationFrame(particleFrame);
        particleFrame = 0;
      }
      if (!particlesEnabled) {
        particleContext.clearRect(0, 0, particleWidth, particleHeight);
        return;
      }
      if (!particleWidth || !particleHeight) resizeParticleCanvas();
      drawParticles(0, !reducedMotion.matches);
    }

    window.addEventListener("resize", () => {
      resizeParticleCanvas();
      if (particlesEnabled && !reducedMotion.matches && !document.hidden && !particleFrame) {
        particleFrame = window.requestAnimationFrame(drawParticles);
      }
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && particleFrame) {
        window.cancelAnimationFrame(particleFrame);
        particleFrame = 0;
      } else if (!document.hidden && particlesEnabled && !reducedMotion.matches && !particleFrame) {
        particleFrame = window.requestAnimationFrame(drawParticles);
      }
    });
    reducedMotion.addEventListener("change", () => {
      if (particlesEnabled) setParticleAnimation(true);
    });
    resizeParticleCanvas();

    // Replace these with your Supabase project URL and anon/public key. Never use a service_role key here.
    const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_OR_PUBLISHABLE_KEY";
    const isConfigured = !SUPABASE_URL.includes("YOUR_PROJECT") &&
      !SUPABASE_ANON_KEY.includes("YOUR_SUPABASE_");
    const supabaseClient = isConfigured && window.supabase
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    const elements = {
      status: document.querySelector("#status"),
      languageSelect: document.querySelector("#language-select"),
      settingsTrigger: document.querySelector("#settings-trigger"),
      settingsDialog: document.querySelector("#settings-dialog"),
      settingsClose: document.querySelector("#settings-close"),
      particlesToggle: document.querySelector("#particles-toggle"),
      authCard: document.querySelector("#auth-card"),
      authForm: document.querySelector("#auth-form"),
      email: document.querySelector("#email"),
      password: document.querySelector("#password"),
      signupButton: document.querySelector("#signup-button"),
      logoutButton: document.querySelector("#logout-button"),
      exportButton: document.querySelector("#export-button"),
      newLogButton: document.querySelector("#new-log-button"),
      cancelEntryButton: document.querySelector("#cancel-entry-button"),
      entryCard: document.querySelector("#entry-card"),
      logForm: document.querySelector("#log-form"),
      logDate: document.querySelector("#log-date"),
      logContent: document.querySelector("#log-content"),
      saveButton: document.querySelector("#save-button"),
      logsCard: document.querySelector("#logs-card"),
      logCount: document.querySelector("#log-count"),
      emptyState: document.querySelector("#empty-state"),
      logList: document.querySelector("#log-list"),
      detailDialog: document.querySelector("#detail-dialog"),
      detailDate: document.querySelector("#detail-date"),
      detailContent: document.querySelector("#detail-content"),
      closeDialog: document.querySelector("#close-dialog")
    };

    let currentUser = null;
    let currentView = "login";
    let logs = [];

    elements.languageSelect.addEventListener("change", () => {
      applyLanguage(elements.languageSelect.value);
    });

    elements.settingsTrigger.addEventListener("click", () => {
      elements.settingsDialog.showModal();
      elements.languageSelect.focus();
    });

    elements.settingsClose.addEventListener("click", () => {
      elements.settingsDialog.close();
    });

    elements.settingsDialog.addEventListener("click", (event) => {
      if (event.target === elements.settingsDialog) {
        elements.settingsDialog.close();
      }
    });

    elements.settingsDialog.addEventListener("close", () => {
      elements.settingsTrigger.focus();
    });

    elements.particlesToggle.addEventListener("change", () => {
      particlesPreference = elements.particlesToggle.checked;
      setParticleAnimation(currentView === "login");
    });

    function setStatus(key, kind = "info", detail = "") {
      statusKey = key;
      statusDetail = detail;
      elements.status.textContent = key ? `${translate(key)}${detail}` : "";
      elements.status.dataset.kind = kind;
      elements.status.hidden = !key;
    }

    function localDateString(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function formatTimestamp(value) {
      if (!value) return "";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? "" : date.toLocaleString(languageLocales[currentLanguage]);
    }

    function showView(view) {
      currentView = view;
      setParticleAnimation(view === "login");
      elements.authCard.hidden = view !== "login";
      elements.logsCard.hidden = view !== "list";
      elements.entryCard.hidden = view !== "write";
      elements.logoutButton.hidden = view === "login";
      elements.exportButton.hidden = view !== "list" || logs.length === 0;
    }

    function renderAuthState() {
      if (!currentUser) {
        logs = [];
        renderLogs();
        showView("login");
        return;
      }

      showView(currentView === "write" ? "write" : "list");
    }

    function renderLogs() {
      elements.logList.replaceChildren();
      elements.logCount.textContent = translate("logCount").replace("{count}", new Intl.NumberFormat(languageLocales[currentLanguage]).format(logs.length));
      elements.emptyState.hidden = logs.length > 0;
      elements.exportButton.hidden = !currentUser || logs.length === 0;

      for (const log of logs) {
        const item = document.createElement("article");
        item.className = "log-item";

        const meta = document.createElement("div");
        meta.className = "log-meta";

        const date = document.createElement("p");
        date.className = "log-date";
        date.textContent = `${log.date}${log.created_at ? ` · ${formatTimestamp(log.created_at)}` : ""}`;

        const preview = document.createElement("p");
        preview.className = "log-preview";
        preview.textContent = log.content.length > 180
          ? `${log.content.slice(0, 180)}…`
          : log.content;

        const detailButton = document.createElement("button");
        detailButton.type = "button";
        detailButton.textContent = translate("detailAction");
        detailButton.addEventListener("click", () => {
          elements.detailDate.textContent = `${log.date}${log.created_at ? ` · ${formatTimestamp(log.created_at)}` : ""}`;
          elements.detailContent.textContent = log.content;
          elements.detailDialog.showModal();
        });

        meta.append(date, preview);
        item.append(meta, detailButton);
        elements.logList.append(item);
      }
    }

    async function loadLogs() {
      if (!supabaseClient || !currentUser) return;

      const requestedUserId = currentUser.id;
      setStatus("loadingLogs");
      const { data, error } = await supabaseClient
        .from("work_logs")
        .select("id, user_id, date, content, created_at")
        .order("created_at", { ascending: false });

      if (currentUser?.id !== requestedUserId) return;

      if (error) {
        console.error("加载工作日志失败：", error);
        setStatus("loadLogsError", "error", error.message);
        return;
      }

      logs = data || [];
      renderLogs();
      setStatus("");
    }

    elements.authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!supabaseClient) return;

      const submitButton = elements.authForm.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      setStatus("loggingIn");
      const { error } = await supabaseClient.auth.signInWithPassword({
        email: elements.email.value.trim(),
        password: elements.password.value
      });
      submitButton.disabled = false;

      if (error) {
        console.error("登录失败：", error);
        setStatus("loginError", "error", error.message);
      } else {
        elements.password.value = "";
        setStatus("loginSuccess", "success");
      }
    });

    elements.signupButton.addEventListener("click", async () => {
      if (!supabaseClient) return;
      if (!elements.authForm.reportValidity()) return;

      elements.signupButton.disabled = true;
      setStatus("signingUp");
      const { data, error } = await supabaseClient.auth.signUp({
        email: elements.email.value.trim(),
        password: elements.password.value
      });
      elements.signupButton.disabled = false;

      if (error) {
        console.error("注册失败：", error);
        setStatus("signupError", "error", error.message);
        return;
      }

      elements.password.value = "";
      if (data.session) {
        setStatus("signupSuccess", "success");
      } else {
        setStatus("verifyEmail", "success");
      }
    });

    elements.logoutButton.addEventListener("click", async () => {
      if (!supabaseClient) return;
      elements.logoutButton.disabled = true;
      const { error } = await supabaseClient.auth.signOut();
      elements.logoutButton.disabled = false;

      if (error) {
        console.error("退出登录失败：", error);
        setStatus("logoutError", "error", error.message);
      } else {
        setStatus("loggedOut", "success");
      }
    });

    elements.newLogButton.addEventListener("click", () => {
      elements.logForm.reset();
      elements.logDate.value = localDateString();
      showView("write");
    });

    elements.cancelEntryButton.addEventListener("click", () => {
      showView("list");
    });

    elements.logForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!supabaseClient || !currentUser) {
        setStatus("pleaseLogin", "error");
        return;
      }

      const content = elements.logContent.value.trim();
      if (!content) {
        setStatus("emptyContentError", "error");
        elements.logContent.focus();
        return;
      }

      elements.saveButton.disabled = true;
      setStatus("savingLog");
      const { error } = await supabaseClient
        .from("work_logs")
        .insert({
          user_id: currentUser.id,
          date: elements.logDate.value,
          content
        });
      elements.saveButton.disabled = false;

      if (error) {
        console.error("保存工作日志失败：", error);
        setStatus("saveError", "error", error.message);
        return;
      }

      elements.logContent.value = "";
      showView("list");
      setStatus("logSaved", "success");
      await loadLogs();
    });

    elements.exportButton.addEventListener("click", () => window.print());
    elements.closeDialog.addEventListener("click", () => elements.detailDialog.close());
    elements.detailDialog.addEventListener("click", (event) => {
      if (event.target === elements.detailDialog) elements.detailDialog.close();
    });

    elements.logDate.value = localDateString();
    applyLanguage(elements.languageSelect.value);

    if (!isConfigured) {
      showView("login");
    } else if (!supabaseClient) {
      showView("login");
      setStatus("supabaseUnavailable", "error");
    } else {
      supabaseClient.auth.getSession().then(({ data, error }) => {
        if (error) {
          console.error("读取登录状态失败：", error);
          setStatus("sessionError", "error", error.message);
          return;
        }

        currentUser = data.session?.user || null;
        renderAuthState();
        if (currentUser) void loadLogs();
      });

      supabaseClient.auth.onAuthStateChange((event, session) => {
        currentUser = session?.user || null;
        if (!currentUser) logs = [];
        renderAuthState();
        if (event !== "INITIAL_SESSION" && currentUser) {
          window.setTimeout(() => void loadLogs(), 0);
        } else if (!currentUser) {
          renderLogs();
        }
      });
    }
  </script>
</body>
</html>
